# ── netlify.toml ────────────────────────────────────────────────
# Netlify build & routing configuration.
# The old github-API-write logic is completely replaced by Sanity.
# Astro's Netlify adapter auto-generates the required functions config.

[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Security headers ────────────────────────────────────────────
# Apply to ALL pages (not just /admin which no longer exists).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Lock down the studio so only authenticated Sanity users can use it.
[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Frame-Options = "DENY"

# ── Redirects ───────────────────────────────────────────────────
# Astro's Netlify adapter handles SSR routing automatically via
# its generated _redirects file. These are supplementary rules.

# Keep any old /admin links working → redirect to new Studio URL.
[[redirects]]
  from   = "/admin"
  to     = "/studio"
  status = 301
  force  = true

[[redirects]]
  from   = "/admin/*"
  to     = "/studio"
  status = 301
  force  = true
